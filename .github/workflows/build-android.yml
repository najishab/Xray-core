name: build-android-cores
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - abi: arm64-v8a
            goarch: arm64
            cc: aarch64-linux-android21-clang
          - abi: armeabi-v7a
            goarch: arm
            goarm: '7'
            cc: armv7a-linux-androideabi21-clang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build xray
        shell: bash
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: '1'
        run: |
          export CC="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.cc }}"
          echo "CC=$CC"
          go build -o xray -trimpath -ldflags "-s -w -buildid=" ./main
          mkdir -p dist
          zip -j "dist/Xray-android-${{ matrix.abi }}.zip" xray
      - uses: actions/upload-artifact@v4
        with:
          name: Xray-android-${{ matrix.abi }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
