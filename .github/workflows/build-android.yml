name: Build and Release Android (ARM64 & ARMv7)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'نام تگ ریلیز (اگر خالی بگذارید خودکار ساخته می‌شود)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            goarm: ""
            asset_name: android-arm64-v8a
            ndk_cc: aarch64-linux-android24-clang
          - goarch: arm
            goarm: "7"
            asset_name: android-arm32-v7a
            ndk_cc: armv7a-linux-androideabi21-clang

    env:
      GOOS: android
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 1

    steps:
      - name: Checkout codebase
        uses: actions/checkout@v7

      - name: Set up Android NDK
        run: |
          wget -qO android-ndk.zip https://dl.google.com/android/repository/android-ndk-r28b-linux.zip
          unzip -q android-ndk.zip
          rm android-ndk.zip
          echo "CC=$(realpath android-ndk-*/toolchains/llvm/prebuilt/linux-x86_64/bin)/${{ matrix.ndk_cc }}" >> $GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download Go dependencies
        run: go mod download

      - name: Build Xray for Android
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty)
          go build -o build_assets/xray -trimpath -buildvcs=false -gcflags="all=-l=4" -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid= -checklinkname=0" -v ./main

      - name: Download GeoIP & GeoSite
        run: |
          curl -fsSL "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/geoip/geoip-lite.dat" -o build_assets/geoip.dat
          curl -fsSL "https://raw.githubusercontent.com/XTLS/Xray-rules-dat/release/geosite/geosite.dat" -o build_assets/geosite.dat

      - name: Copy README.md & LICENSE
        run: |
          cp "${GITHUB_WORKSPACE}/README.md" ./build_assets/README.md
          cp "${GITHUB_WORKSPACE}/LICENSE" ./build_assets/LICENSE

      - name: Create ZIP archive & Checksums
        run: |
          mkdir -p dist
          pushd build_assets > /dev/null
          touch -mt "$(date +%Y01010000)" *
          zip -9vr "../dist/Xray-${{ matrix.asset_name }}.zip" .
          popd > /dev/null

          FILE="./dist/Xray-${{ matrix.asset_name }}.zip"
          DGST="${FILE}.dgst"
          rm -f "${DGST}"
          for METHOD in md5 sha1 sha256 sha512; do
            openssl dgst -"${METHOD}" "${FILE}" | sed 's/([^)]*)//g' >> "${DGST}"
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Xray-${{ matrix.asset_name }}
          path: ./dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="android-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi

          if gh release view "${TAG}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "${TAG}" ./artifacts/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "${TAG}" ./artifacts/* \
              --repo "${{ github.repository }}" \
              --target "${GITHUB_SHA}" \
              --title "Xray-core Android (${TAG})" \
              --notes "Android builds (arm64-v8a & arm32-v7a) for commit ${GITHUB_SHA::7}."
          fi
